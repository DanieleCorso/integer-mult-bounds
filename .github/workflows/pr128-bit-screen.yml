name: PR128 restricted bit groups - rational-H negative control
on:
  push:
    branches:
      - research/pr128-zero-frame-sharing-screen
  pull_request:
    paths:
      - 'research/pr128-zero-frame-sharing-screen/**'
      - '.github/workflows/pr128-bit-screen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-screen:
    name: Rational-H counterexample and screened moment (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run exact hypothesis screen (not a physical certificate)
        run: |
          python3 research/pr128-zero-frame-sharing-screen/verify_screen.py > /tmp/bit-screen.json
          python3 -m json.tool /tmp/bit-screen.json > /dev/null
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/bit-screen.json'))
          assert r['rational_H_orthogonal_pairs']==0
          assert r['rational_H_nonorthogonal_pairs']==17514
          assert r['legal_bit_supplier_certified'] is False
          assert r['status'].startswith('PASS F2 geometry and formal moment; FAIL PR129')
          print('PASS negative control: the hypothesized +10.83% bit result is NOT legal')
          PY
          cat /tmp/bit-screen.json
      - name: Check tracked artifacts unchanged
        run: git diff --exit-code
