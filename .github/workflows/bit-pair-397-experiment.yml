name: Bit-pair 397 candidate (no kappa claim)
on:
  workflow_dispatch:
  push:
    branches:
      - research/paired-cube-6558-bit-pair-cse
jobs:
  pair-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent exact n10 and n11 module verification
        run: python3 -B research/bit-pair-cse/verify_both.py
      - name: Independently verify n=10 and n=11 candidate modules
        run: python3 -B research/bit-pair-cse/verify_optimized_modules.py
      - name: Exact 1760-target decoder and 8800 root-cap checks with tamper controls
        run: python3 -B research/bit-pair-cse/verify_full_decoder.py
      - name: Full bit candidate including physical frame geometry
        run: python3 -B research/bit-pair-cse/trial.py --variant both
