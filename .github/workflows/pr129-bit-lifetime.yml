name: PR129 bit birth-cut candidate screen
on:
  push:
    branches:
      - research/pr129-plus3-frame-search
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bit-lifetime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.11'}
      - run: python3 research/frontier-plus3/frontier_bounds.py
      - run: python3 research/frontier-plus3/bit_lifetime_scan.py > /tmp/bit_lifetime_scan.json
      - run: python3 -m json.tool /tmp/bit_lifetime_scan.json
      - run: cat /tmp/bit_lifetime_scan.json
      - run: git diff --exit-code
